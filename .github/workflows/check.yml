name: Alias and compatibility checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install deebot-client==18.7.0
      - run: python -m compileall -q custom_components tests
      - run: python -m unittest discover -s tests -v
